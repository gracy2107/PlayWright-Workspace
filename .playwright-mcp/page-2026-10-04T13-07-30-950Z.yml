                - generic:
                  - paragraph: At Lokachakra, we understand that life sometimes calls for a pause — whether for personal growth, health, family, entrepreneurship, or exploration. But stepping back doesn’t mean you’re out. This drive empowers experienced professionals to transition into high-impact, future-tech roles within our decentralized innovation ecosystem.
                  - paragraph: Our ecosystem breaks down traditional siloes. Students gain verified work experience, startups access top-tier talent on-demand, and executives find new avenues for strategic advisory. We weave trust, verification, and incentivization into every interaction, ensuring equitable growth for all participants.
