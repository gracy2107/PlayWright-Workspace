              - paragraph: "Lokachakra emerged from years of intensive research exploring system models for open innovation. The core pain point identified was the fragmentation of networks: students had no access to verified startup jobs, startups could not find reliable gig-workers, and executives were isolated from founders. We built a double-layered platform to link them under secure, verifiable trust structures."
